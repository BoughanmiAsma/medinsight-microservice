name: DevSecOps CI/CD Pipeline

on:
  push:
    branches: 
      - main
      - feature/DevSecOps
      - feature/deploy
  pull_request:
    branches:
      - main
  workflow_dispatch:

env:
  DOCKER_IMAGE_PREFIX: boughanmiasma/pds
  NAMESPACE: medinsight

jobs:
  # ==================== PHASE 1: PRE-COMMIT SECURITY ====================
  secret-scan:
    name: 🔐 Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ==================== PHASE 2: DEPENDENCY SECURITY (SCA) ====================
  dependency-scan:
    name: 📦 Dependency Vulnerability Scan (SCA)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - MedInsight-Microservices/dossier-service
          - MedInsight-Microservices/lab-service
          - MedInsight-Microservices/ordonnance-service
          - MedInsight-Microservices/Staff-service
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy Dependency Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '${{ matrix.service }}'
          format: 'table'
          vuln-type: 'library'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

  # ==================== PHASE 3: IAC SECURITY ====================
  iac-security-scan:
    name: 🏗️ Infrastructure Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Trivy K8s Manifests Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'k8s/'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Trivy Terraform Scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'config'
          scan-ref: 'infra/terraform/'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'  # Warning only for Terraform

  # ==================== PHASE 4: BUILD & SAST ====================
  build-and-analyze:
    name: 🔨 Build & SAST Analysis
    needs: [secret-scan, dependency-scan, iac-security-scan]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service_path:
          - MedInsight-Microservices/dossier-service
          - MedInsight-Microservices/lab-service
          - MedInsight-Microservices/ordonnance-service
          - MedInsight-Microservices/Staff-service

    services:
      sonarqube:
        image: sonarqube:community
        ports:
          - 9000:9000
        options: --health-cmd="curl -f http://localhost:9000/api/system/status || exit 1" --health-interval=10s --health-timeout=5s --health-retries=20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build with Maven
        working-directory: ./${{ matrix.service_path }}
        run: mvn clean package -DskipTests -B

      - name: Wait for SonarQube
        run: |
          echo "Waiting for SonarQube..."
          for i in {1..30}; do
            if curl -s -u admin:admin http://localhost:9000/api/system/status | grep -q "UP"; then
              echo "SonarQube is ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 10
          done

      - name: Configure SonarQube & Generate Token
        run: |
          NEW_PASS="${{ secrets.SONAR_ADMIN_PASSWORD }}"
          if [ -z "$NEW_PASS" ]; then NEW_PASS="MedInsightSecure2026_"; fi
          
          curl -s -u admin:admin -X POST "http://localhost:9000/api/users/change_password?login=admin&previousPassword=admin&password=$NEW_PASS" || true
          
          TOKEN_NAME="DevSecOps-$(date +%s)"
          TOKEN_JSON=$(curl -s -u admin:$NEW_PASS -X POST "http://localhost:9000/api/user_tokens/generate?name=$TOKEN_NAME&type=GLOBAL_ANALYSIS_TOKEN")
          SONAR_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.token')
          
          if [ "$SONAR_TOKEN" == "null" ] || [ -z "$SONAR_TOKEN" ]; then
            echo "Token generation failed: $TOKEN_JSON"
            exit 1
          fi
          
          echo "SONAR_TOKEN=$SONAR_TOKEN" >> $GITHUB_ENV

      - name: SonarQube SAST Analysis
        working-directory: ./${{ matrix.service_path }}
        run: |
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar \
            -DskipTests \
            -Dsonar.projectKey=$(basename ${{ matrix.service_path }} | tr '[:upper:]' '[:lower:]') \
            -Dsonar.projectName=$(basename ${{ matrix.service_path }}) \
            -Dsonar.host.url=http://localhost:9000 \
            -Dsonar.token="${{ env.SONAR_TOKEN }}"

      - name: Set Service Variables
        run: |
          SERVICE_DIR=$(basename ${{ matrix.service_path }})
          
          if [ "$SERVICE_DIR" == "lab-service" ]; then
            IMAGE_NAME="laboratoire"
            K8S_DIR="laboratoire-service"
          elif [ "$SERVICE_DIR" == "Staff-service" ]; then
            IMAGE_NAME="staff"
            K8S_DIR="staff-service"
          else
            IMAGE_NAME=$(echo $SERVICE_DIR | sed 's/-service//I' | tr '[:upper:]' '[:lower:]')
            K8S_DIR=$SERVICE_DIR
          fi
          
          echo "IMAGE_NAME=$IMAGE_NAME" >> $GITHUB_ENV
          echo "K8S_DIR=$K8S_DIR" >> $GITHUB_ENV
          echo "IMAGE_TAG=${{ env.DOCKER_IMAGE_PREFIX }}:service-$IMAGE_NAME" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build -t "${{ env.IMAGE_TAG }}" ./${{ matrix.service_path }}

      - name: Trivy Container Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_TAG }}
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

      - name: Push Docker Image
        run: |
          docker push "${{ env.IMAGE_TAG }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.MASTER_IP }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Création du dossier de déploiement si nécessaire
            mkdir -p ~/deploy-medinsight
            cd ~/deploy-medinsight
            
            # Clone ou Pull du repo pour avoir les fichiers YAML à jour
            if [ -d ".git" ]; then
              git pull origin feature/DevSecOps
            else
              git clone -b feature/DevSecOps https://github.com/BoughanmiAsma/medinsight-microservice.git .
            fi
            
            MANIFEST_PATH="k8s/${{ env.K8S_DIR }}/${{ env.K8S_DIR }}.yml"
            
            # Mise à jour de l'image (Rolling Update)
            kubectl set image deployment/${{ env.K8S_DIR }} ${{ env.K8S_DIR }}=${{ env.IMAGE_TAG }} -n ${{ env.NAMESPACE }} || true
            
            # Application des manifests (si nouvelle resource)
            kubectl apply -f $MANIFEST_PATH -n ${{ env.NAMESPACE }}
            
            # Attente de la fin du déploiement
            kubectl rollout status deployment/${{ env.K8S_DIR }} -n ${{ env.NAMESPACE }}

  # ==================== PHASE 5: DAST (Dynamic Testing) ====================
  dast-security-scan:
    name: 🌐 DAST - OWASP ZAP Scan
    needs: build-and-analyze
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://52.205.61.44:8200'
          rules_file_name: '.zap/rules.tsv'
          cmd_options: '-a'
          fail_action: false

  # ==================== PHASE 6: SECURITY REPORT ====================
  security-report:
    name: 📊 Security Summary
    needs: [secret-scan, dependency-scan, iac-security-scan, build-and-analyze]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Generate Security Report
        run: |
          echo "## 🛡️ DevSecOps Security Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Phase | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 🔐 Secret Scan | ${{ needs.secret-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 📦 Dependency Scan | ${{ needs.dependency-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🏗️ IaC Security | ${{ needs.iac-security-scan.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 🔨 Build & SAST | ${{ needs.build-and-analyze.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Pipeline:** DevSecOps CI/CD" >> $GITHUB_STEP_SUMMARY
          echo "**Branch:** ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
