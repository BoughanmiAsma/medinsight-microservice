server.port=8081
spring.application.name=lab-service

# Database (Talking to Docker Postgres on port 5434)
spring.datasource.url=jdbc:postgresql://postgres:5432/medinsight_platform

spring.datasource.username=admin
spring.datasource.password=password
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Kafka
spring.kafka.bootstrap-servers=kafka:9092

spring.kafka.consumer.group-id=lab-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer

# Resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8180/realms/microservices-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8180/realms/microservices-realm/protocol/openid-connect/certs

# Keycloak
keycloak.server-url=http://keycloak:8180

keycloak.realm=microservices-realm
keycloak.client-id=lab-service
keycloak.client-secret=lab-service-secret-2024

# File download base URL (Gateway URL)
file.download-base-url=http://localhost:8200/lab/files/
