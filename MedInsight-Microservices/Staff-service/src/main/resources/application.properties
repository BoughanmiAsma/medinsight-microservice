spring.application.name=Staff-service

# DataSource Configuration (Local host talking to Docker database on port 3307)
# Note: Dans docker-compose.yml, port 3307 est mappé sur 3306 du container
spring.datasource.url=jdbc:mysql://mysql:3306/staffdb

spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.create-schemas=true

server.port=9002

# Logging
logging.level.root=INFO
logging.level.com.medinsight.staff=DEBUG
logging.level.org.flyway=DEBUG

# Keycloak Admin client (Local host talking to Keycloak on port 8180)
keycloak.server-url=http://keycloak:8180

keycloak.realm=microservices-realm
keycloak.client-id=staff-service
keycloak.client-secret=staff-service-secret-2024

# Resource server
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://keycloak:8180/realms/microservices-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8180/realms/microservices-realm/protocol/openid-connect/certs

# Actuator Health Endpoints for Kubernetes
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=always
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true
