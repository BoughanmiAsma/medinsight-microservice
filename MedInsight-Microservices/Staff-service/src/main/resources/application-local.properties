# Configuration pour l'exécution locale (hors conteneurs)
spring.application.name=Staff-service

# Database Configuration (Localhost via port mapping)
# Correspond au port 3307 mappé dans docker-compose.yml
spring.datasource.url=jdbc:mysql://localhost:3307/staffdb
spring.datasource.username=root
spring.datasource.password=secret
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Keycloak Configuration (Localhost via port mapping)
# Correspond au port 8180 mappé dans docker-compose.yml
keycloak.server-url=http://localhost:8180
keycloak.realm=microservices-realm
keycloak.client-id=staff-service
keycloak.client-secret=staff-service-secret-2024

# Resource Server (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/microservices-realm
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8180/realms/microservices-realm/protocol/openid-connect/certs

# Logging
logging.level.root=INFO
logging.level.com.medinsight.staff=DEBUG
