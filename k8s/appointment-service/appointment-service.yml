apiVersion: apps/v1
kind: Deployment
metadata:
  name: appointment-service
  namespace: medinsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: appointment-service
  template:
    metadata:
      labels:
        app: appointment-service
    spec:
      containers:
      - name: appointment-service
        image: boughanmiasma/pds:service-appointment
        ports:
        - containerPort: 8083
        env:
        - name: SPRING_DATASOURCE_URL
          value: jdbc:postgresql://postgres:5432/medinsight_platform
        - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
          value: kafka:9092
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: appointment-service
  namespace: medinsight
spec:
  selector:
    app: appointment-service
  ports:
  - port: 8083
    targetPort: 8083
    nodePort: 30083
  type: NodePort
