apiVersion: v1
kind: Secret
metadata:
  name: staff-secret
  namespace: medinsight
type: Opaque
stringData:
  DB_PASSWORD: MedInsight123!
  KEYCLOAK_CLIENT_SECRET: medinsight-secret-key-123
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: staff-config
  namespace: medinsight
data:
  SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/staffdb
  SPRING_DATASOURCE_USERNAME: admin
  KEYCLOAK_AUTH_SERVER_URL: http://keycloak:8180
  KEYCLOAK_REALM: medinsight-realm
  KEYCLOAK_RESOURCE: staff-service
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: staff-service
  namespace: medinsight
spec:
  replicas: 1
  selector:
    matchLabels:
      app: staff-service
  template:
    metadata:
      labels:
        app: staff-service
    spec:
      containers:
      - name: staff-service
        image: boughanmiasma/pds:service-staff
        ports:
        - containerPort: 9002
        envFrom:
        - configMapRef:
            name: staff-config
        env:
        - name: SPRING_DATASOURCE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: staff-secret
              key: DB_PASSWORD
        - name: KEYCLOAK_CREDENTIALS_SECRET
          valueFrom:
            secretKeyRef:
              name: staff-secret
              key: KEYCLOAK_CLIENT_SECRET
        - name: MANAGEMENT_ENDPOINT_HEALTH_PROBES_ENABLED
          value: "true"
        - name: MANAGEMENT_HEALTH_LIVENESSSTATE_ENABLED
          value: "true"
        - name: MANAGEMENT_HEALTH_READINESSSTATE_ENABLED
          value: "true"
        - name: MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE
          value: "health,info"
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /actuator/health
            port: 9002
          initialDelaySeconds: 150
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 9002
          initialDelaySeconds: 100
          periodSeconds: 20
          timeoutSeconds: 10
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /actuator/health
            port: 9002
          initialDelaySeconds: 30
          periodSeconds: 15
          timeoutSeconds: 5
          failureThreshold: 20
---
apiVersion: v1
kind: Service
metadata:
  name: staff-service
  namespace: medinsight
spec:
  selector:
    app: staff-service
  ports:
  - port: 9002
    targetPort: 9002
  type: ClusterIP
